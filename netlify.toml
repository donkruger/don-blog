# Don Kruger — static publish to Netlify
# Push to main → npm run build → dist → don-kruger-blog.netlify.app

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache: hashed Vite assets ────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── HTML (short cache) ───────────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

# ── Clean URLs for posts ─────────────────────────────────────────────────────
[[redirects]]
  from = "/posts/*"
  to = "/posts/:splat/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
